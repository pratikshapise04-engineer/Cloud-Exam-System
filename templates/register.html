{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-7 col-lg-6">
<div class="card shadow-sm border-0">
<div class="card-body p-4">
<h2 class="fw-bold mb-4">Create Account</h2>
<form method="post">
    <label class="form-label">Full Name</label>
    <input class="form-control mb-3" name="name" required>
    <label class="form-label">Email</label>
    <input class="form-control mb-3" type="email" name="email" required>
    <label class="form-label">Password</label>
    <input class="form-control mb-3" type="password" name="password" minlength="6" required>
    <label class="form-label">Register as</label>
    <select class="form-select mb-4" name="role">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
    </select>
    <button class="btn btn-primary w-100">Register</button>
</form>
</div></div></div></div>
{% endblock %}
