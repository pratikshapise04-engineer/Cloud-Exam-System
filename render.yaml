services:
  - type: web
    name: cloudexam
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloudexam-db
          property: connectionString

databases:
  - name: cloudexam-db
    databaseName: cloudexam
    user: cloudexam
